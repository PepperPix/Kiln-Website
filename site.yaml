title: Engobe
description: A fast, extensible static site generator for .NET
baseUrl: https://engobe.studio
language: en
theme: default

home:
  page: content/index.md

collections:
  posts:
    directory: content/posts
    permalink: /blog/:slug/
    sort: date desc
    feed: true
    paginate: 10
    taxonomies:
      - tags
      - categories
    layout: post

  pages:
    directory: content/pages
    permalink: /:slug/
    sort: weight asc
    layout: page

  api:
    directory: content/api
    permalink: /api/:slug/
    sort: weight asc
    layout: api

taxonomies:
  tags:
    permalink: /tags/:slug/
    paginate: 20
  categories:
    permalink: /categories/:slug/
    paginate: 10

menus:
  main:
    - title: Home
      url: /
    - title: Blog
      ref: posts/
    - title: API
      url: /api/
    - title: About
      ref: pages/about

search:
  enabled: true
  extended: false
